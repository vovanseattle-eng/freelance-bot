services:
  - type: web
    name: freelance-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: freelance_orders.db
      - key: RSS_POLL_INTERVAL
        value: "60"
